<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad-gen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <filter id="gen-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Contenedor redondeado con degradado índigo -->
  <rect x="10" y="10" width="180" height="180" rx="45" fill="url(#grad-gen)" stroke="#818CF8" stroke-width="4" filter="url(#gen-shadow)"/>
  <!-- Birrete Académico Minimalista de Alta Definición -->
  <path d="M100 48 L168 76 L100 104 L32 76 Z" fill="#FFFFFF"/>
  <path d="M60 88 V120 C60 134 76 146 100 146 C124 146 140 134 140 120 V88" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
  <!-- Borla colgante verde esmeralda -->
  <path d="M156 82 V124 L150 132 H162 L156 124" stroke="#10B981" stroke-width="5" fill="#10B981" stroke-linejoin="round"/>
  <!-- Estrella de excelencia académica -->
  <circle cx="100" cy="120" r="6" fill="#F59E0B"/>
  <!-- Texto base -->
  <rect x="42" y="156" width="116" height="24" rx="6" fill="#10B981"/>
  <text x="100" y="172" fill="#FFFFFF" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="900" text-anchor="middle" letter-spacing="2">ESTUDIANTE</text>
</svg>
