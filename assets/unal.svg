      <stop offset="0%" stop-color="#005522"/>
      <stop offset="100%" stop-color="#002B11"/>
    </linearGradient>
  </defs>
  <rect x="12" y="12" width="176" height="176" rx="36" fill="url(#unal-bg)" stroke="#22C55E" stroke-width="3"/>
